version: '3.8'

services:
  # Service 1: The FastAPI Serving Layer
  api:
    build: .
    container_name: fintech_sentiment_api
    command: python -m uvicorn src.api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  # Service 2: The Scheduled ETL Pipeline Worker
  etl_worker:
    build: .
    container_name: fintech_sentiment_worker
    command: python main.py --schedule 120
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped
